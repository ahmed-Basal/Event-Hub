name: reactivities

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: reactivities-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-reactivities}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./keycloak/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reactivities-net

  # ── Seq (Logs + log-correlated traces) ────────────────────────────────────
  seq:
    image: datalust/seq:2024.3
    container_name: reactivities-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq_data:/data
    ports:
      - "8081:80"     # Web UI -> http://localhost:8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/api || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - reactivities-net

  # ── Jaeger (Distributed Trace UI) ─────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: reactivities-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI -> http://localhost:16686
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - reactivities-net

  # ── OpenTelemetry Collector (Centralized Trace Batching & Fan-out) ────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: reactivities-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
      seq:
        condition: service_started
    networks:
      - reactivities-net

  # ── Prometheus (Metrics Scraper + Alert Rules) ────────────────────────────
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: reactivities-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI -> http://localhost:9090
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - reactivities-net

  # ── Grafana (Metrics Dashboards) ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.2
    container_name: reactivities-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"   # Grafana UI -> http://localhost:3001
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - reactivities-net

  # ── Keycloak (Identity & Access Management / OIDC) ────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: reactivities-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8082:8080"   # Keycloak UI / Realm -> http://localhost:8082
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reactivities-net

  # ── .NET API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/API/Dockerfile
    container_name: reactivities-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-reactivities};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Keycloak__Authority: http://keycloak:8080/realms/reactivities
      Keycloak__ValidIssuer: http://localhost:8082/realms/reactivities
      Keycloak__Audience: reactivities-api
      OpenTelemetry__OtlpCollectorEndpoint: http://otel-collector:4317
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - reactivities-net

  # ── Next.js Web Client (SSR Standalone) ────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: src/UI/Dockerfile
    container_name: reactivities-client
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8085/api
      NEXT_PUBLIC_HUB_URL: http://localhost:8085/comments
      INTERNAL_API_URL: http://api:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - reactivities-net

volumes:
  postgres_data:
  seq_data:
  prometheus_data:
  grafana_data:

networks:
  reactivities-net:
    driver: bridge
