name: reactivities

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: reactivities-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "121600129"
      POSTGRES_DB: reactivities
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reactivities-net

  # ── Seq (Logs + log-correlated traces) ────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: reactivities-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq_data:/data
    ports:
      - "5341:5341"   # OTLP ingestion + log API
      - "8081:80"     # Web UI -> http://localhost:8081
    networks:
      - reactivities-net

  # ── Jaeger (Distributed Trace UI) ─────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: reactivities-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI -> http://localhost:16686
      - "4317:4317"    # OTLP gRPC from API
    networks:
      - reactivities-net

  # ── Prometheus (Metrics Scraper) ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: reactivities-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI -> http://localhost:9090
    depends_on:
      - api
    networks:
      - reactivities-net

  # ── Grafana (Metrics Dashboards) ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: reactivities-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"   # Grafana UI -> http://localhost:3001
    depends_on:
      - prometheus
    networks:
      - reactivities-net

  # ── .NET API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/API/Dockerfile
    container_name: reactivities-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - reactivities-net

  # ── React Client (Nginx) ───────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: reactivities-client
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - reactivities-net

volumes:
  postgres_data:
  seq_data:
  prometheus_data:
  grafana_data:

networks:
  reactivities-net:
    driver: bridge
