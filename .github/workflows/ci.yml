name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend CI (.NET 11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (11.0 Preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'DevMeet.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore DevMeet.slnx

      - name: Build Solution (Release)
        run: dotnet build DevMeet.slnx --no-restore --configuration Release

      - name: Run Unit Tests & Collect Coverage
        run: dotnet test DevMeet.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload Test Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/TestResults/**'
          retention-days: 7

  frontend:
    name: Frontend CI (React 19 + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/UI

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/UI/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Build React SPA (TypeScript + Vite)
        run: npm run build

      - name: Upload Frontend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/UI/dist/
          retention-days: 7

  docker-verification:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build API Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/API/Dockerfile
          push: false
          tags: devmeet-api:test

      - name: Build UI Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./src/UI
          file: src/UI/Dockerfile
          push: false
          tags: devmeet-ui:test
