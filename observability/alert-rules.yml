groups:
  - name: eventhub-api-alerts
    rules:
      - alert: ApiUnavailable
        expr: up{job="reactivities-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Event-Hub API is down"
          description: "Prometheus cannot scrape /metrics from reactivities-api for more than 1 minute."

      - alert: HighHttp5xxErrorRate
        expr: |
          (
            sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_request_duration_seconds_count[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate (> 5%)"
          description: "More than 5% of HTTP requests returned 5xx over the last 5 minutes."

      - alert: HighApiP95Latency
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le)) > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API p95 latency (> 1.5s)"
          description: "95th percentile HTTP request duration exceeded 1.5 seconds for 5 minutes."

      - alert: OutboxBacklogGrowing
        expr: devmeet_outbox_pending_messages > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox backlog exceeds 50 pending messages"
          description: "OutboxProcessor is falling behind; {{ $value }} messages are pending."

      - alert: OutboxDeadLetterFailures
        expr: increase(devmeet_outbox_processed_total{outcome="failed"}[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Outbox message moved to dead-letter Failed state"
          description: "One or more Outbox messages exhausted retries in the last 15 minutes."

      - alert: RepeatedPaymentFailures
        expr: increase(devmeet_payments_total{outcome="failed"}[15m]) >= 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Repeated payment failures detected"
          description: "5 or more payment failures occurred in the last 15 minutes."
