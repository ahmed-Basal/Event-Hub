<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Vibrant Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Squircle Brand Base (Crisp, High Contrast) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#goldGradient)" stroke="#FFE898" stroke-width="1.5" />

  <!-- Code Bracket Glyph </ > -->
  <g fill="#0A0F1D">
    <!-- Left Bracket < -->
    <path d="M 23.5 22.5 L 14 32 L 23.5 41.5 L 26.5 38.5 L 20 32 L 26.5 25.5 Z" />

    <!-- Center Slash / -->
    <polygon points="34,18 38,18 29.5,46 25.5,46" />

    <!-- Right Bracket > -->
    <path d="M 40.5 22.5 L 37.5 25.5 L 44 32 L 37.5 38.5 L 40.5 41.5 L 50 32 Z" />
  </g>

  <!-- Accent Coral Notification Dot -->
  <circle cx="50" cy="14" r="6" fill="#0A0F1D" />
  <circle cx="50" cy="14" r="4.5" fill="#FF4655" />
  <circle cx="48.5" cy="12.5" r="1.5" fill="#FFFFFF" />
</svg>